<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>25-Second Number Challenge</title>
<style>
:root{
  --bg:#fff4e0;--surface:#ffffff;--ink:#2a1b4d;--muted:#7a6a9a;--track:#ead9c0;
  --accent:#ff5a5f;--ok:#17b26a;--ok-ink:#fff;--bad:#e5384b;--warn:#ff3b30;--btn:#2a1b4d;--btn-ink:#fff;
  --shadow:0 4px 0 rgba(42,27,77,.18);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1033;--surface:#2b1d52;--ink:#fff3dc;--muted:#a999d1;--track:#3a2a69;
  --accent:#ff7a6b;--ok:#2ad17f;--ok-ink:#06301b;--bad:#ff5468;--warn:#ff5468;--btn:#ffd166;--btn-ink:#2a1b4d;
  --shadow:0 4px 0 rgba(0,0,0,.35);}}
:root[data-theme="dark"]{--bg:#1a1033;--surface:#2b1d52;--ink:#fff3dc;--muted:#a999d1;--track:#3a2a69;--accent:#ff7a6b;--ok:#2ad17f;--ok-ink:#06301b;--bad:#ff5468;--warn:#ff5468;--btn:#ffd166;--btn-ink:#2a1b4d;--shadow:0 4px 0 rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden;transition:background .3s}
body.urgent{animation:flash 1s steps(2) infinite}
@keyframes flash{50%{background:color-mix(in srgb,var(--warn) 18%,var(--bg))}}
main{width:100%;max-width:460px;padding:14px 14px 22px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:clamp(22px,6vw,30px);font-weight:900;letter-spacing:-.5px;text-align:center}
h1 span{color:var(--accent)}
.hud{background:var(--surface);border-radius:22px;padding:12px 16px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
#time{font-size:clamp(44px,14vw,64px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;transition:color .2s}
#time small{font-size:.4em;font-weight:700;color:var(--muted)}
.hud.urgent #time{color:var(--warn);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.stat{text-align:right;font-weight:800;font-size:15px;line-height:1.3}
.stat em{font-style:normal;color:var(--muted);font-weight:700;display:block;font-size:13px}
.bar{grid-column:1/-1;height:14px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:10px}
#fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffb703,#ff5a5f,#a855f7);transition:width .25s cubic-bezier(.3,1.4,.6,1)}
#hint{text-align:center;font-weight:800;min-height:24px;color:var(--muted)}
#hint b{color:var(--accent);font-size:1.25em}
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,2vw,10px);transition:opacity .25s,filter .25s}
#board.locked{opacity:.45;filter:saturate(.4);pointer-events:none}
.tile{aspect-ratio:1;border:0;border-radius:clamp(12px,3.5vw,18px);background:var(--surface);color:hsl(var(--h) 75% 48%);
  font:900 clamp(22px,7vw,34px) "Trebuchet MS","Segoe UI",system-ui,sans-serif;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .12s,background .15s,color .15s,box-shadow .12s;padding:0}
@media (hover:hover){.tile:hover{transform:translateY(-3px) scale(1.04)}}
.tile:active{transform:translateY(3px) scale(.94);box-shadow:none}
#strip{display:flex;flex-wrap:wrap;gap:5px;min-height:38px;padding:8px 10px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);align-content:flex-start}
#strip:empty::before{content:"Selected numbers appear here";color:var(--muted);font-weight:700;font-size:14px;line-height:22px}
#strip span{min-width:26px;padding:0 6px;height:22px;line-height:22px;text-align:center;border-radius:8px;background:var(--track);font-weight:900;font-size:13px}
.lb{background:var(--surface);border-radius:22px;padding:14px 14px 12px;box-shadow:var(--shadow)}
.lb h2{margin:0;font-size:20px;font-weight:900}
.lb small{color:var(--muted);font-weight:700;font-size:13px}
#lbList{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
#lbList li{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--bg);font-weight:800;font-size:15px}
#lbList li.me{outline:2px solid var(--accent)}
#lbList .rk{color:var(--accent);font-weight:900}
#lbList .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lbList .sc{font-variant-numeric:tabular-nums}
#lbList .tm{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
#lbList li.empty{display:block;text-align:center;color:var(--muted)}
#nameIn{width:100%;font:800 20px "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:13px 14px;border-radius:14px;border:3px solid var(--track);background:var(--bg);color:var(--ink);margin:4px 0 14px;text-align:center}
#nameIn:focus{outline:none;border-color:var(--accent)}
#nameIn.err{border-color:var(--bad)}
.tile.wrong{background:var(--bad);color:#fff;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.btns{display:flex;gap:10px}
button.b{flex:1;border:0;border-radius:16px;padding:15px 10px;font:900 17px "Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--btn);color:var(--btn-ink);cursor:pointer;box-shadow:var(--shadow);transition:transform .1s}
button.b.alt{background:var(--surface);color:var(--ink)}
button.b:active{transform:translateY(3px);box-shadow:none}
button.b:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#over,#nameModal{position:fixed;inset:0;background:rgba(26,16,51,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:20;backdrop-filter:blur(3px)}
#over.show,#nameModal.show{display:flex}
.card{background:var(--surface);color:var(--ink);border-radius:28px;padding:28px 22px;width:100%;max-width:340px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:rise .4s cubic-bezier(.3,1.5,.6,1)}
@keyframes rise{from{transform:scale(.7);opacity:0}}
.card .big{font-size:56px;line-height:1}
.card h2{margin:8px 0 6px;font-size:28px;font-weight:900}
.card p{margin:0 0 18px;color:var(--muted);font-weight:700;line-height:1.5}
.card p strong{color:var(--ink);font-size:1.15em}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<main>
  <h1>25-Second <span>Number</span> Challenge</h1>
  <section class="hud" id="hud" aria-live="off">
    <div id="time">25.00<small> s</small></div>
    <div class="stat"><em>Numbers completed</em><span id="count">0/25</span></div>
    <div class="bar"><div id="fill"></div></div>
  </section>
  <div id="hint">Press Start Game to begin</div>
  <div id="strip" aria-label="Selected numbers"></div>
  <div id="board" class="locked" aria-label="Number grid"></div>
  <div class="btns">
    <button class="b" id="start">Start Game</button>
    <button class="b alt" id="restart">Restart Game</button>
  </div>
  <section class="lb">
    <h2>Leaderboard <small id="lbMeta"></small></h2>
    <ol id="lbList"></ol>
  </section>
</main>

<div id="nameModal" role="dialog" aria-modal="true">
  <div class="card">
    <div class="big">👋</div>
    <h2>Who’s playing?</h2>
    <p>Your name goes on the leaderboard.</p>
    <input id="nameIn" maxlength="16" placeholder="Enter your name" autocomplete="off">
    <button class="b" id="go" style="width:100%">Let’s go</button>
  </div>
</div>

<div id="over" role="dialog" aria-modal="true">
  <div class="card">
    <div class="big" id="oIcon"></div>
    <h2 id="oTitle"></h2>
    <p id="oText"></p>
    <button class="b" id="again" style="width:100%">Play Again</button>
  </div>
</div>

<script>
(function(){
  var LIMIT=25000, N=25;
  var board=document.getElementById('board'), timeEl=document.getElementById('time'),
      countEl=document.getElementById('count'), fillEl=document.getElementById('fill'),
      hint=document.getElementById('hint'), hud=document.getElementById('hud'),
      startBtn=document.getElementById('start'), restartBtn=document.getElementById('restart'),
      over=document.getElementById('over');
  // state: 'idle' (board locked) | 'ready' (waiting for 1) | 'running' | 'ended'
  var state='idle', next=1, t0=0, timerId=null, prev=null, tiles=[], player='', lastTime=0, recs=[], lastName='';
  var stripEl=document.getElementById('strip');
  try{recs=JSON.parse(localStorage.getItem('n25recs')||'[]')||[];lastName=localStorage.getItem('n25name')||''}catch(e){recs=[]}
  function esc(s){return s.replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';'})}
  function cmp(a,b){return b.score-a.score||a.time-b.time||a.at-b.at}
  function saveRec(score,time){
    var r={name:player,score:score,time:time,at:Date.now()};recs.push(r);
    if(recs.length>1000)recs=recs.slice(-1000);
    try{localStorage.setItem('n25recs',JSON.stringify(recs))}catch(e){}
    return r;
  }
  function renderLB(me){
    var s=recs.slice().sort(cmp),list=document.getElementById('lbList');list.textContent='';
    document.getElementById('lbMeta').textContent=recs.length+(recs.length===1?' game':' games')+' saved';
    if(!s.length){var e=document.createElement('li');e.className='empty';e.textContent='No scores yet. Finish a round to take the top spot.';list.appendChild(e);return}
    s.slice(0,10).forEach(function(r,i){
      var li=document.createElement('li');if(r===me)li.className='me';
      [['rk','#'+(i+1)],['nm',r.name],['sc',r.score+'/'+N],['tm',fmt(r.time)+'s']].forEach(function(p){
        var sp=document.createElement('span');sp.className=p[0];sp.textContent=p[1];li.appendChild(sp)});
      list.appendChild(li);
    });
  }

  function shuffle(){
    var a,tries=0;
    do{
      a=[];for(var i=1;i<=N;i++)a.push(i);
      for(var j=N-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[k];a[k]=t}
      tries++;
    }while(prev&&a.join()===prev&&tries<20);
    prev=a.join();return a;
  }
  function fmt(ms){return (Math.max(0,ms)/1000).toFixed(2)}
  function setTime(ms){
    var left=LIMIT-ms;
    timeEl.firstChild.nodeValue=fmt(left);
    var urgent=state==='running'&&left<=5000;
    hud.classList.toggle('urgent',urgent);document.body.classList.toggle('urgent',urgent);
  }
  function stopTimer(){if(timerId!==null){clearInterval(timerId);timerId=null}}
  function progress(){
    var d=next-1;countEl.textContent=d+'/'+N;fillEl.style.width=(d/N*100)+'%';
    stripEl.textContent='';
    for(var i=1;i<=d;i++){var c=document.createElement('span');c.textContent=i;stripEl.appendChild(c)}
  }
  function setHint(){
    if(state==='idle')hint.textContent='Press Start Game to begin';
    else if(state==='ready')hint.innerHTML='Tap <b>1</b> to start the clock';
    else if(state==='running')hint.textContent='Player: '+player;
    else hint.textContent='';
  }
  function build(){
    board.innerHTML='';tiles=[];
    shuffle().forEach(function(n){
      var b=document.createElement('button');
      b.className='tile';b.textContent=n;b.dataset.n=n;b.style.setProperty('--h',(n*14.4+10)%360);
      b.setAttribute('aria-label','Number '+n);
      board.appendChild(b);tiles.push(b);
    });
  }
  function reset(unlock){
    stopTimer();clearConfetti();over.classList.remove('show');
    state=unlock?'ready':'idle';next=1;lastTime=0;
    build();progress();setTime(0);hud.classList.remove('urgent');document.body.classList.remove('urgent');
    board.classList.toggle('locked',!unlock);setHint();
  }
  function tick(){
    var el=performance.now()-t0;
    if(el>=LIMIT){setTime(LIMIT);end(false);return}
    setTime(el);
  }
  function begin(){
    state='running';t0=performance.now();stopTimer();
    timerId=setInterval(tick,30);
  }
  function end(won){
    if(state==='ended')return;
    var el=Math.min(performance.now()-t0,LIMIT);
    stopTimer();state='ended';
    board.classList.add('locked');
    hud.classList.remove('urgent');document.body.classList.remove('urgent');
    var done=next-1;
    document.getElementById('oIcon').textContent=won?'\uD83C\uDFC6':'\u23F1\uFE0F';
    document.getElementById('oTitle').textContent=won?'You won!':'Time’s up!';
    var txt;
    var rec=saveRec(done,won?el:(lastTime||LIMIT));
    var rank=recs.slice().sort(cmp).indexOf(rec)+1;
    if(won){
      setTime(el);
      txt='You tapped all 25 in <strong>'+fmt(el)+' s</strong>.';
      confetti();
    }else{
      txt='Final score: <strong>'+done+'/'+N+'</strong>';
    }
    txt+='<br>'+esc(player)+', you’re #'+rank+' on the leaderboard';
    renderLB(rec);
    document.getElementById('oText').innerHTML=txt;
    setHint();
    setTimeout(function(){over.classList.add('show')},won?500:250);
    try{navigator.vibrate&&navigator.vibrate(won?[60,40,60]:200)}catch(e){}
  }
  function press(e){
    var t=e.target.closest('.tile');
    if(!t||(state!=='ready'&&state!=='running'))return;
    if(t.classList.contains('done'))return;
    var n=+t.dataset.n;
    if(state==='running'&&performance.now()-t0>=LIMIT){end(false);return}
    if(n===next){
      if(state==='ready')begin();
      t.classList.add('done');lastTime=performance.now()-t0;
      next++;progress();
      if(next>N){end(true)}else setHint();
    }else{
      t.classList.remove('wrong');void t.offsetWidth;t.classList.add('wrong');
      setTimeout(function(){t.classList.remove('wrong')},350);
      try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
    }
  }
  var cf=[];
  function confetti(){
    var cols=['#ff5a5f','#ffb703','#17b26a','#3b82f6','#a855f7','#ff7ab6'];
    for(var i=0;i<70;i++){
      var c=document.createElement('div');c.className='confetti';
      c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
      c.style.setProperty('--dx',(Math.random()*160-80)+'px');
      c.style.animationDuration=(1.8+Math.random()*1.8)+'s';c.style.animationDelay=(Math.random()*.5)+'s';
      c.style.borderRadius=i%3?'2px':'50%';
      document.body.appendChild(c);cf.push(c);
    }
    setTimeout(clearConfetti,4500);
  }
  function clearConfetti(){cf.forEach(function(c){c.remove()});cf=[]}

  board.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();press(e)});
  board.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();press(e)}});
  var nameModal=document.getElementById('nameModal'), nameIn=document.getElementById('nameIn');
  function askName(){
    reset(false);nameIn.classList.remove('err');nameIn.value=player||lastName;
    nameModal.classList.add('show');setTimeout(function(){nameIn.focus();nameIn.select()},60);
  }
  function go(){
    var v=nameIn.value.trim().slice(0,16);
    if(!v){nameIn.classList.add('err');nameIn.focus();return}
    player=v;lastName=v;try{localStorage.setItem('n25name',v)}catch(e){}
    nameModal.classList.remove('show');reset(true);
  }
  startBtn.addEventListener('click',askName);
  restartBtn.addEventListener('click',function(){player?reset(true):askName()});
  document.getElementById('again').addEventListener('click',function(){player?reset(true):askName()});
  document.getElementById('go').addEventListener('click',go);
  nameIn.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  nameModal.addEventListener('click',function(e){if(e.target===nameModal)nameModal.classList.remove('show')});
  document.addEventListener('visibilitychange',function(){if(state==='running')tick()});

  reset(false);renderLB();
})();
</script>
</body>
</html>
